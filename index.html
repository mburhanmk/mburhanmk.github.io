<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Muhammed Burhan M K — Finance &amp; Operations Analyst</title>
<meta name="description" content="Muhammed Burhan M K — Finance and Operations Analyst specializing in financial analysis, reporting, process automation and private-markets intelligence." />
<meta name="theme-color" content="#0b0d0f" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar__inner">
    <a href="#top" class="topbar__name" id="nav-name">—</a>
    <nav class="topbar__nav" id="nav-links" aria-label="Section navigation"></nav>
    <button class="topbar__menu" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="top">

  <section class="hero" id="hero">
    <div class="hero__inner">
      <div class="hero__text">
        <p class="hero__kicker" id="hero-kicker"></p>
        <h1 class="hero__headline" id="hero-headline"></h1>
        <p class="hero__tagline" id="hero-tagline"></p>
        <p class="hero__location" id="hero-location"></p>
        <div class="hero__actions" id="hero-actions"></div>
      </div>
      <aside class="statement" id="hero-statement" aria-label="Career statement"></aside>
    </div>
  </section>

  <section class="section" id="about">
    <div class="section__inner section__inner--narrow">
      <h2 class="section__heading" id="about-heading"></h2>
      <div class="about__body" id="about-body"></div>
      <div class="about__facts" id="about-facts"></div>
    </div>
  </section>

  <section class="section" id="experience">
    <div class="section__inner">
      <div class="section__head"><h2 class="section__heading" id="experience-heading"></h2><p class="section__sub" id="experience-sub"></p></div>
      <div class="timeline" id="experience-list"></div>
    </div>
  </section>

  <section class="section" id="skills">
    <div class="section__inner">
      <div class="section__head"><h2 class="section__heading" id="skills-heading"></h2><p class="section__sub" id="skills-sub"></p></div>
      <div class="skills-grid" id="skills-list"></div>
    </div>
  </section>

  <section class="section" id="achievements">
    <div class="section__inner">
      <div class="section__head"><h2 class="section__heading" id="achievements-heading"></h2><p class="section__sub" id="achievements-sub"></p></div>
      <div class="achievements-grid" id="achievements-list"></div>
    </div>
  </section>

  <section class="section" id="education">
    <div class="section__inner">
      <h2 class="section__heading" id="education-heading"></h2>
      <div class="edu-grid">
        <div>
          <div class="skills-cat__title" id="education-title"></div>
          <div id="education-list"></div>
        </div>
        <div>
          <div class="skills-cat__title" id="certifications-title"></div>
          <ul class="cert-list" id="certifications-list"></ul>
        </div>
      </div>
    </div>
  </section>

  <section class="section section--contact" id="contact">
    <div class="section__inner section__inner--narrow">
      <h2 class="section__heading" id="contact-heading"></h2>
      <p class="contact__text" id="contact-text"></p>
      <div class="contact__links" id="contact-links"></div>
      <form class="contact-form" id="contact-form">
        <div class="form-row">
          <label>Email<input type="email" id="sender-email" placeholder="you@example.com" required></label>
          <label>Subject<input type="text" id="email-subject" placeholder="Let's work together" required></label>
        </div>
        <label>Message<textarea id="email-body" rows="7" placeholder="Tell me a little about the opportunity..." required></textarea></label>
        <button class="btn btn--solid btn--large" type="submit">Send Email ↗</button>
        <p class="form-note">Your email app will open with the message</p>
      </form>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="footer__inner">
    <span id="footer-name"></span>
    <span id="footer-tagline"></span>
    <a href="#top">Back to top ↑</a>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
